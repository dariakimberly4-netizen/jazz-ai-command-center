name = "jazz-whatsapp-fallback"
main = "worker.js"
compatibility_date = "2026-08-12"

[triggers]
crons = ["15 1 * * *"]

[vars]
WA_TEMPLATE_NAME = "jazz_daily_fallback"
WA_TEMPLATE_LANG = "en_US"
JAZZ_URL = "https://dariakimberly4-netizen.github.io/jazz-ai-command-center/"
ALLOWED_ORIGIN = "https://dariakimberly4-netizen.github.io"

# Add these privately in Cloudflare Worker settings instead of committing them:
# JAZZ_DEVICE_KEY      — same private key entered once in Jazz on Kimmy's phone
# WA_ACCESS_TOKEN      — Meta WhatsApp Cloud API token
# WA_PHONE_NUMBER_ID   — WhatsApp business phone-number ID
# WA_TO                — Kimmy's WhatsApp number in international format
# WA_GRAPH_VERSION     — Graph API version currently supported by the Meta app
# FALLBACK_KV binding  — Workers KV namespace used for heartbeat/report state
