name: Force latest Jazz Live Work scripts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-live-work.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Jazz
        uses: actions/checkout@v4

      - name: Fix real deploy and force fresh scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_handler = "else if(a==='deploy')deploy();"
          new_handler = "else if(a==='deploy'){if(window.JazzDeployAll&&typeof window.JazzDeployAll.start==='function')window.JazzDeployAll.start();else deploy();}"
          if old_handler in s:
              s = s.replace(old_handler, new_handler)

          replacements = {
              'whatsapp-fallback-client.js?v=28': 'whatsapp-fallback-client.js?v=29',
              'jazz-agent-engine.js?v=28': 'jazz-agent-engine.js?v=29',
              'jazz-apps-script-agents.js?v=28': 'jazz-apps-script-agents.js?v=29',
              'whatsapp-fallback.js?v=28': 'whatsapp-fallback.js?v=29',
              'live-work-enhancement.js?v=28': 'live-work-enhancement.js?v=29',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          bridge = Path('jazz-apps-script-agents.js')
          b = bridge.read_text(encoding='utf-8')
          replacements_bridge = {
              "try { window.JazzAgentEngine?.render(task); } catch (_) {}": "try { if (!(window.JazzDeployAll?.state?.().active)) window.JazzAgentEngine?.render(task); } catch (_) {}",
              "try { window.JazzAgentEngine?.render(rows[i]); } catch (_) {}": "try { if (!(window.JazzDeployAll?.state?.().active)) window.JazzAgentEngine?.render(rows[i]); } catch (_) {}",
          }
          for old, new in replacements_bridge.items():
              b = b.replace(old, new)
          bridge.write_text(b, encoding='utf-8')
          PY

          grep -n "a==='deploy'" index.html | tail -n 2
          grep -nE 'jazz-agent-engine|jazz-apps-script-agents|whatsapp-fallback.js|live-work-enhancement.js' index.html | tail -n 10
          grep -n "JazzDeployAll.*state" jazz-apps-script-agents.js | head -n 10

      - name: Commit deploy fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html jazz-apps-script-agents.js
          git commit -m 'Finish real Deploy Agents board v29'
          git push
