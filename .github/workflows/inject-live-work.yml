name: Force latest Jazz Live Work scripts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-live-work.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Jazz
        uses: actions/checkout@v4

      - name: Force fresh agent scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'whatsapp-fallback-client.js?v=26': 'whatsapp-fallback-client.js?v=27',
              'jazz-agent-engine.js?v=26': 'jazz-agent-engine.js?v=27',
              'jazz-apps-script-agents.js?v=26': 'jazz-apps-script-agents.js?v=27',
              'whatsapp-fallback.js?v=26': 'whatsapp-fallback.js?v=27',
              'live-work-enhancement.js?v=26': 'live-work-enhancement.js?v=27',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          grep -nE 'whatsapp-fallback-client|jazz-agent-engine|jazz-apps-script-agents|whatsapp-fallback.js|live-work-enhancement.js' index.html | tail -n 10

      - name: Commit cache-bust
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Force latest Jazz agent scripts v27'
          git push
