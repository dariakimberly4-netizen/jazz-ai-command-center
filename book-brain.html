<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070817">
<title>Jazz Book Brain — Beyond the Tremor</title>
<style>
:root{--night:#050613;--panel:#11132b;--violet:#7a43c7;--gold:#d9bd7c;--ivory:#fff8e9;--muted:#aaa8bd;--green:#69e7b4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#291353 0,transparent 40%),linear-gradient(#070817,#03040d);color:var(--ivory);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh;padding:20px 14px 40px}.wrap{width:min(100%,760px);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.back{min-height:48px;border:1px solid #6a54a2;border-radius:15px;background:#181a3a;color:#fff;padding:0 15px;font-weight:900}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:.1em;font-size:.75rem}.hero{background:rgba(19,19,48,.82);border:1px solid rgba(156,108,255,.35);border-radius:24px;padding:20px;box-shadow:0 14px 35px rgba(0,0,0,.3)}h1{font-size:clamp(1.55rem,5vw,2.1rem);margin:8px 0}.sub{color:var(--muted);line-height:1.5}.status{display:inline-block;border-radius:99px;padding:7px 11px;background:rgba(105,231,180,.16);color:#baffdf;font-weight:900;font-size:.78rem;margin:8px 0 15px}.input{display:grid;grid-template-columns:1fr 82px;gap:10px}.input input{min-height:60px;border:2px solid #6a54a2;border-radius:18px;background:#090a1c;color:#fff;padding:0 15px;font-size:1rem;min-width:0}.input button,.quick button{border:1px solid var(--gold);border-radius:18px;background:linear-gradient(135deg,#d9bd7c,#ae8640);color:#24192d;font-weight:1000}.quick{display:flex;gap:9px;overflow:auto;padding:13px 0}.quick button{flex:0 0 auto;min-height:48px;padding:0 14px;background:#28213b;color:#fff;border-color:#6a54a2}.results{display:grid;gap:12px;margin-top:8px}.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:19px;padding:16px}.card small{color:var(--gold);font-weight:900}.card h2{font-size:1.02rem;margin:6px 0}.card p{color:#ddd;line-height:1.55;margin:8px 0}.quote{border-left:4px solid var(--gold);padding-left:12px;color:#fff!important}.note{color:var(--muted);font-size:.82rem}.empty{text-align:center;color:var(--muted);padding:28px 12px}.source-lock{border-left:4px solid var(--green);padding-left:12px;color:#c8f8e4;line-height:1.45}.error{color:#ff9ca5}.mic{min-height:52px;width:100%;margin-top:10px;border:1px solid #6a54a2;border-radius:16px;background:#181a3a;color:#fff;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="eyebrow">JAZZ KNOWLEDGE BRAIN</div><strong>Beyond the Tremor</strong></div><button class="back" onclick="location.href='./'">← JAZZ HOME</button></div>
  <section class="hero">
    <div class="eyebrow">SOURCE-GROUNDED BOOK KNOWLEDGE</div>
    <h1>🧠 Ask My Book</h1>
    <p class="source-lock">Jazz searches the Book Brain first. Exact quotations are shown only when stored as verified book quotes; summaries are labeled as summaries.</p>
    <div class="status" id="status">LOADING BOOK…</div>
    <div class="input"><input id="q" placeholder="Ask about faith, DBS, family, resilience…" aria-label="Ask Beyond the Tremor"><button id="ask">ASK</button></div>
    <button class="mic" id="mic">🎙 SPEAK QUESTION</button>
    <div class="quick"><button data-q="What does my book say about resilience?">Resilience</button><button data-q="What does my book say about my mother and family?">Family</button><button data-q="What does my book say about DBS?">DBS</button><button data-q="What does my book say about advocacy and purpose?">Purpose</button></div>
    <div class="results" id="results"><div class="empty">Ask a question about your book.</div></div>
  </section>
</div>
<script>
let brain=null;
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function score(e,q){const terms=q.toLowerCase().split(/[^a-z0-9₱]+/).filter(x=>x.length>2);const themes=(e.themes||[]).join(' ').toLowerCase();const hay=[e.chapter,e.summary,themes,e.exact_quote||''].join(' ').toLowerCase();let s=0;for(const t of terms){if(hay.includes(t))s++;if(themes.includes(t))s+=2;if(String(e.chapter||'').toLowerCase().includes(t))s+=2}return s}
function search(q){if(!brain?.entries)return[];let r=brain.entries.map(e=>({e,s:score(e,q)})).sort((a,b)=>b.s-a.s).filter(x=>x.s>0).slice(0,5).map(x=>x.e);return r.length?r:brain.entries.slice(0,3)}
function speak(t){if(!('speechSynthesis' in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-PH';u.rate=.9;speechSynthesis.speak(u)}
function answer(){const q=$('#q').value.trim();if(!q)return;const hits=search(q);$('#results').innerHTML=hits.map(e=>`<article class="card"><small>BOOK SOURCE • ${esc(e.pages?('PAGE '+e.pages):'SOURCE')}</small><h2>${esc(e.chapter)}</h2><p>${esc(e.summary)}</p>${e.exact_quote?`<p class="quote"><strong>Exact quote:</strong> “${esc(e.exact_quote)}”</p>`:''}<div class="note">Source mode: Beyond the Tremor • ${e.exact_quote?'verified quote available':'summary/paraphrase'}</div></article>`).join('');if(hits[0])speak(hits[0].summary)}
fetch('book-brain.json?v=23',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{brain=d;$('#status').textContent='READY • SOURCE LOCK ON'}).catch(()=>{$('#status').textContent='BOOK DATA COULD NOT LOAD';$('#status').classList.add('error')});
$('#ask').onclick=answer;$('#q').onkeydown=e=>{if(e.key==='Enter')answer()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('#q').value=b.dataset.q;answer()});
$('#mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice input is not supported here. You can press Windows + H.');return}const r=new SR();r.lang='en-PH';r.onresult=e=>{$('#q').value=e.results[0][0].transcript;answer()};r.start()};
</script>
</body>
</html>
